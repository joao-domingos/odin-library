<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>Page Title</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
</style>
<script src="objectConstructor.js"></script>
<body>
    <header>
        Library do juca
    </header>
    
    <button id="btn_form">add new book</button>
    <form id="my_form">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required>
        <label for="pages">Pages:</label>
        <input type="number" id="pages" name="pages" min="1" max="3000" required>
        <label for="read">Did you read it?</label>
        <input type="checkbox" id="read" name="read">
        <input type="submit">
    </form>

    <input type="button" value="show books" onclick="showBooks()" />

</body>
</html>
